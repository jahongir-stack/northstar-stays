<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account | Northstar Stays</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header><b>Northstar Stays</b><a href="{{ url_for('index') }}">Home</a></header><main><h1>Your account</h1>{% with messages=get_flashed_messages() %}{% for message in messages %}<p class="notice">{{ message }}</p>{% endfor %}{% endwith %}<div class="grid"><section class="card"><h2>Sign in</h2><form method="post"><input type="email" name="email" placeholder="Email" required><input type="password" name="password" placeholder="Password" required><button>Sign in</button></form></section><section class="card"><h2>Create account</h2><form method="post"><input type="hidden" name="action" value="register"><input type="email" name="email" placeholder="Email" required><input type="password" name="password" placeholder="Password (8+ characters)" minlength="8" required><button>Create account</button></form></section></div></main></body></html>
